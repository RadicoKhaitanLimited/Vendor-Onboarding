# Vendor Onboarding Portal - nginx server block
#
# Phase B: install this as-is (HTTP only, no TLS yet) and confirm
#   curl http://<static-ip>/  loads the app from outside the VM.
# Phase C: run `certbot --nginx -d <ip-with-dashes>.sslip.io` - certbot
#   rewrites this file to add the 443 server block and the 80->443
#   redirect automatically. Don't hand-add TLS directives before that.
#
# Replace <APP_ROOT> below with /opt/vendor-onboarding (or wherever the
# repo is cloned on the VM) and <HOSTNAME> with the sslip.io hostname
# (or later, the real domain) before installing.

server {
    listen 80;
    listen [::]:80;
    server_name <HOSTNAME>;

    client_max_body_size 20M;

    # Built React SPA (rsynced in by push.sh) - serve directly, no proxy.
    root <APP_ROOT>/frontend/dist;

    # Hashed assets (index-XXXX.js etc.) - safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Django static files (admin CSS/JS, whitenoise-collected).
    location /static/ {
        alias <APP_ROOT>/backend/staticfiles/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploaded documents.
    location /media/ {
        alias <APP_ROOT>/backend/media/;
    }

    # API and Django admin - proxy to gunicorn.
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # SPA fallback - everything else serves index.html (client-side routing),
    # and index.html itself must never be cached (Vite content-hashes the
    # asset filenames it references, so a stale cached index.html points at
    # filenames that no longer exist after a rebuild).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
